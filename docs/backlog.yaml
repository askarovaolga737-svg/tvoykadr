  - id: task-006
    phase: mvp
    title: Заказ монтажа фото и видео
    description: "Создать страницу с формой заказа монтажа. Пользователь может
      загрузить свой файл (фото или видео), написать описание работы и отправить
      заказ. После отправки — подтверждение. В админ-панели добавить раздел с
      заказами: просмотр деталей и отметка о выполнении."
    priority: high
    acceptance_criteria:
      - Пользователь видит страницу с формой заказа монтажа
      - Пользователь может загрузить файл (фото или видео)
      - Пользователь может написать описание работы
      - Пользователь может отправить заказ
      - После отправки пользователь видит подтверждение
      - Админ видит новые заказы в админ-панели
      - Админ может просмотреть детали заказа
      - Админ может отметить заказ как выполненный
    depends_on:
      - task-002
    related_feature: Заказ монтажа фото и видео
    status: completed
    summary: "Реализована страница /orders с формой заказа монтажа (компонент
      OrderForm): загрузка фото/видео (до 10 МБ), описание работы, подтверждение
      после отправки. Добавлена таблица orders в DynamoDB, API /api/orders
      (GET/POST/PATCH), публичные и админские эндпоинты. В админ-панели добавлен
      раздел Заказы с фильтрацией (новые/выполненные), просмотром деталей (файл,
      описание, контакты) и отметкой о выполнении. Основная реализация:
      app/orders/page.tsx, components/order-form.tsx,
      components/admin-orders.tsx, app/api/orders/route.ts, lib/schema.ts,
      lib/models.ts, lib/validation.ts."
  - id: task-007
    phase: mvp
    title: Смена названия платформы на ТвойКадр
    description:
      "Заменить название Creative Vault на ТвойКадр во всём приложении:
