    priority: medium
    acceptance_criteria:
      - В шапке сайта отображается «ТвойКадр» вместо Creative Vault
      - В подвале сайта отображается «ТвойКадр»
      - Заголовок вкладки браузера — «ТвойКадр»
    depends_on: []
    related_feature: Наложение рамок на фото
    status: completed
    summary: "Название платформы заменено с Creative Vault на ТвойКадр во всех
      частях приложения: константа appName в app/layout.tsx (заголовок вкладки,
      шапка, подвал), H1 на главной странице app/page.tsx и описание в
      админ-панели app/admin/page.tsx. typecheck, lint, build — без ошибок."
  - id: task-008
    phase: mvp
    title: Градиентный фон на всём сайте
    description:
      Добавить красивый градиентный фон на все страницы сайта — плавные
      переливы фиолетового, розового и голубого. Фон должен быть мягким, не
