    priority: medium
    acceptance_criteria:
      - На всех страницах сайта виден плавный градиентный фон
      - Фон не мешает читаемости текста и контента
      - Градиент выглядит современно и стильно
    depends_on: []
    related_feature: Наложение рамок на фото
    status: completed
    summary:
      "Добавлен плавный градиентный фон на все страницы сайта: мягкий переход
      от светло-фиолетового (#f5f0ff) через розовый (#fdf0f7) и голубой
      (#f0f4ff) к зелёному (#f0faf0) под углом 135°. Фон не перебивает контент
      благодаря низкой насыщенности цветов. Основная реализация: app/globals.css
      (body + .dark body + .bg-gradient-site утилита)."
  - id: task-009
    phase: mvp
    title: Настройка входа в админ-панель
