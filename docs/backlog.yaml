    acceptance_criteria:
      - Админ может выбрать файл на компьютере и загрузить рамку
      - Админ может выбрать файл на компьютере и загрузить шаблон картинки
      - Админ может выбрать файл на компьютере и загрузить видеоролик
      - Загруженные файлы отображаются в списке контента с превью
      - Старые рамки/шаблоны/видео, добавленные по URL, продолжают работать
    depends_on:
