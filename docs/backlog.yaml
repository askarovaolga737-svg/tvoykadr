      - После перезапуска контейнера вход в админ-панель работает с паролем
        admin123
    depends_on: []
    related_feature: Админ-панель
    status: completed
    summary:
      В .env.docker добавлена переменная ADMIN_PASSWORD=admin123. Контейнер
      app перезапущен через docker compose up -d --force-recreate app.
      Typecheck, lint (0 errors, 5 pre-existing warnings) и build пройдены
      успешно.
  - id: task-010
    phase: mvp
    title: Загрузка файлов в админ-панели вместо URL
    description:
      "Переделать форму добавления контента в админ-панели: вместо поля
      для ссылки (URL) сделать загрузку файла с компьютера. Файлы сохраняются в
      папку /public/uploads. Рамки и шаблоны — изображения (JPG/PNG), видео —
      MP4. После загрузки файла он сразу доступен по ссылке /uploads/имя_файла."
