phases:
  - id: mvp
    name: MVP
    description: Минимально жизнеспособный продукт
    order: 1
tasks:
  - id: task-001
    phase: mvp
    title: Визуальная заглушка главной страницы
    description: >-
      Создать главную страницу приложения с крупными превью-карточками разделов:
      Рамки, Картинки, Видео. Данные — статические заглушки.

      Цель: дать пользователю первый визуальный результат как можно быстрее.
    priority: high
    acceptance_criteria:
      - "Главная страница отображается с тремя разделами: Рамки, Картинки, Видео"
      - Каждый раздел имеет крупное превью и название
      - Дизайн соответствует творческому стилю — яркие акценты, плавные анимации
    depends_on: []
    related_feature: Наложение рамок на фото
    status: completed
    summary:
      "Реализована главная страница Creative Vault с тремя разделами: Рамки,
      Картинки, Видео. Каждый раздел представлен крупной превью-карточкой с
      градиентным фоном, иконкой и названием. Использованы яркие акценты
      (violet/pink/amber), плавные анимации (animate-in, card-hover) и
      градиентный hero-блок. Основная реализация: app/page.tsx."
  - id: task-002
    phase: mvp
    title: "Админ-панель: управление контентом"
    description: Создать админ-панель с авторизацией, где админ может загружать
      рамки, картинки-шаблоны и видеоролики, а также просматривать и удалять
      загруженный контент.
    priority: high
    acceptance_criteria:
      - Админ может войти в панель управления
      - Админ может загрузить рамку (изображение + название)
      - Админ может загрузить шаблон картинки
      - Админ может загрузить видеоролик
      - Админ видит список всего загруженного контента
      - Админ может удалить любой элемент
    depends_on:
      - task-001
    related_feature: Админ-панель
    status: completed
    summary: "Реализована админ-панель с авторизацией по паролю (переменная
      окружения ADMIN_PASSWORD). Добавлены: таблица content в DynamoDB,
      API-роуты /api/auth/login и /api/content (GET/POST/DELETE), страница
      /admin с формой входа и панелью управления. Админ может загружать рамки,
      картинки-шаблоны и видеоролики (URL + название), просматривать весь
      контент с фильтрацией по типу и удалять элементы. Основная реализация:
      app/admin/page.tsx, components/admin-panel.tsx,
      components/admin-login.tsx, app/api/content/route.ts,
      app/api/auth/login/route.ts, lib/models.ts, lib/schema.ts,
      lib/validation.ts."
  - id: task-003
    phase: mvp
    title: Галерея рамок и наложение на фото
    description: Создать страницу с галереей рамок, загруженных админом.
      Пользователь может выбрать рамку, загрузить своё фото, увидеть
      предпросмотр результата и скачать готовое изображение.
    priority: high
    acceptance_criteria:
      - Пользователь видит галерею рамок с превью
      - Пользователь может загрузить своё фото (JPG/PNG)
      - Пользователь видит предпросмотр фото с выбранной рамкой
      - Пользователь может скачать готовое изображение
    depends_on:
      - task-002
    related_feature: Наложение рамок на фото
    status: completed
    summary:
      "Реализована страница /frames с галереей рамок и наложением на фото.
      Пользователь выбирает рамку из галереи (превью с названием), загружает
      своё фото (JPG/PNG), видит предпросмотр с наложенной рамкой через Canvas
      API и может скачать результат. Добавлено публичное API /api/frames,
      компонент FrameStudio с Canvas-композитингом (drawImage), скелетоном
      загрузки и кнопками замены/скачивания. Основная реализация:
      app/frames/page.tsx, components/frame-studio.tsx,
      app/api/frames/route.ts."
  - id: task-004
    phase: mvp
    title: Галерея шаблонов и генерация картинок
    description: Создать страницу с галереей шаблонов картинок. Пользователь
      выбирает шаблон, вводит свой текст, видит предпросмотр и скачивает готовую
      картинку.
    priority: high
    acceptance_criteria:
      - Пользователь видит галерею шаблонов картинок
      - Пользователь может ввести свой текст для шаблона
      - Пользователь видит предпросмотр готовой картинки
      - Пользователь может скачать результат
    depends_on:
      - task-002
    related_feature: Генерация картинок по шаблонам
    status: completed
    summary: "Реализована страница /templates с галереей шаблонов картинок и
      генерацией изображений с текстом. Пользователь выбирает шаблон из галереи
      (превью с названием), вводит свой текст в поле ввода, видит предпросмотр с
      наложенным текстом через Canvas API (тёмная полупрозрачная полоса внизу,
      адаптивный размер шрифта, перенос строк) и может скачать результат PNG.
      Добавлено публичное API /api/templates, компонент TemplateStudio с Canvas
      и skeleton загрузки. Основная реализация: app/templates/page.tsx,
      components/template-studio.tsx, app/api/templates/route.ts."
  - id: task-005
    phase: mvp
    title: Галерея видеороликов с просмотром и скачиванием
    description: Создать страницу с галереей видеороликов. Пользователь видит
      превью, может посмотреть видео в плеере и скачать файл.
    priority: medium
    acceptance_criteria:
      - Пользователь видит галерею видеороликов с превью
      - Пользователь может просмотреть видео в плеере
      - Пользователь может скачать видеофайл
    depends_on:
      - task-002
    related_feature: Скачивание видеороликов
    status: completed
    summary: "Реализована страница /videos с галереей видеороликов. Пользователь
      видит превью-карточки с градиентным фоном и иконкой Play, выбирает видео,
