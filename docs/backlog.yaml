      /uploads/имя_файла. Для рамок и шаблонов — JPG/PNG (до 10 МБ), для видео —
      MP4 (до 50 МБ), с валидацией на клиенте и сервере. Загруженные файлы
      отображаются в списке с превью. Старые элементы, добавленные по URL,
      продолжают работать. Основная реализация: components/admin-panel.tsx,
      app/api/content/route.ts, lib/validation.ts."
